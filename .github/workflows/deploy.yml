name: Spring Boot CD

on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/s-dung/ongil-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ongil-Server CD Discord Notification (success)
        if: ${{ success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          status: ${{ job.status }}
          title: '🚀 [Server] 이미지 푸시 성공 🚀'
          description: 'GHCR 이미지 빌드 및 푸시 완료'
          color: 65280
          username: 'Server-bot'

      - name: Ongil-Server CD Discord Notification (failure)
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          status: ${{ job.status }}
          title: '❗️ [Server] 이미지 푸시 실패 ❗️'
          description: 'GHCR 이미지 빌드 또는 푸시 실패'
          color: 16711680
          username: 'Server-bot'
