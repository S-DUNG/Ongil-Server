name: Spring Boot CD

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/s-dung/ongil-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ongil-Server CD Discord Notification (build failure)
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          status: ${{ job.status }}
          title: '❗️ [Server] 이미지 빌드 실패 ❗️'
          description: 'GHCR 이미지 빌드 또는 푸시 실패'
          color: 16711680
          username: 'Server-bot'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: SSM으로 EC2 배포
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          PARAMS=$(jq -n '{commands: [
            "set -e",
            "export PATH=/usr/local/bin:/usr/bin:$PATH",
            "cd /home/ec2-user/Ongil-DevOps",
            "docker-compose pull app",
            "docker-compose up -d app",
            "for i in $(seq 1 30); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 3; done",
            "curl -sf http://localhost:8080/v3/api-docs > /dev/null && echo \"health check passed\"",
            "docker image prune -f"
          ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $CMD_ID"

          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "===== stdout ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== stderr ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true

          [ "$STATUS" = "Success" ]

      - name: Ongil-Server CD Discord Notification (success)
        if: ${{ success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          status: ${{ job.status }}
          title: '🚀 [Server] 배포 성공 🚀'
          description: 'EC2 배포 및 헬스체크 완료'
          color: 65280
          username: 'Server-bot'

      - name: Ongil-Server CD Discord Notification (failure)
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          status: ${{ job.status }}
          title: '❗️ [Server] 배포 실패 ❗️'
          description: 'EC2 배포 실패, Actions 로그를 확인해주세요'
          color: 16711680
          username: 'Server-bot'